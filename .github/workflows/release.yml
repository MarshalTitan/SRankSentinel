name: Publish Beta

on:
  push:
    branches:
      - main
    paths:
      - SRankSentinel.csproj
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: windows-latest

    steps:
      - name: Check out release source
        uses: actions/checkout@v4

      - name: Audit supported Faloop POI coverage
        run: node .github/scripts/Audit-FaloopCatalog.mjs FaloopCatalog.cs HuntCatalog.cs FaloopClient.cs

      - name: Audit shared Sentinel Modern integration
        run: node .github/scripts/Audit-SentinelModern.mjs

      - name: Download and verify published SentinelCore packages
        shell: pwsh
        run: ./.github/scripts/Prepare-SentinelCore.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Path $dalamudDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamudDir -Force

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'SRankSentinel.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Version must contain four numeric components: $version"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore
        run: dotnet restore SRankSentinel.csproj --locked-mode

      - name: Verify restored shared-package content hashes
        shell: pwsh
        run: ./.github/scripts/Prepare-SentinelCore.ps1 -VerifyOnly -AssetsPath obj/project.assets.json

      - name: Record dependency lock
        shell: pwsh
        run: Get-Content -LiteralPath packages.lock.json

      - name: Audit restored travel and field-recovery contracts
        run: |
          node .github/scripts/Audit-V734TravelRestore.mjs Plugin.cs NativeTravel.cs HuntCatalog.cs VNavmeshIpc.cs
          node .github/scripts/Audit-FieldRecovery.mjs Plugin.cs CombatController.cs HuntProgressPolicy.cs SRankSentinel.csproj

      - name: Run state-machine regression tests
        run: dotnet run --project SRankSentinel.StateTests/SRankSentinel.StateTests.csproj -c Release

      - name: Build release package
        run: dotnet build SRankSentinel.csproj -c Release --no-restore

      - name: Run appearance migration and native ImGui input tests
        shell: pwsh
        run: |
          ./.github/scripts/Prepare-UiTestFont.ps1
          $env:DALAMUD_ICON_FONT = Join-Path $env:RUNNER_TEMP 'Sentinel-FontAwesomeFreeSolid.otf'
          dotnet run --project SRankSentinel.UiTests/SRankSentinel.UiTests.csproj -c Release

      - name: Validate installable ZIP
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-Package.ps1
          -PackagePath 'bin/Release/SRankSentinel/latest.zip'
          -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Prepare named release asset
        shell: pwsh
        run: Copy-Item -LiteralPath 'bin/Release/SRankSentinel/latest.zip' -Destination "$env:RUNNER_TEMP\SRankSentinel.zip" -Force

      - name: Publish immutable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $asset = "$env:RUNNER_TEMP\SRankSentinel.zip"
          $releaseJson = gh release view $tag --repo '${{ github.repository }}' --json targetCommitish,isDraft,isPrerelease,assets 2>$null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($exists) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.targetCommitish -ne '${{ github.sha }}' -or $release.isDraft -or !$release.isPrerelease) {
              throw "Release $tag belongs to another source/state. Increment the version; assets are immutable."
            }
            if (@($release.assets | Where-Object name -eq 'SRankSentinel.zip').Count -ne 1) {
              throw "Release $tag must contain exactly one SRankSentinel.zip; do not replace published assets."
            }
            Write-Host "Revalidating the existing immutable release for this exact source."
          }
          else {
            gh release create $tag $asset --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "S Rank Sentinel ${{ steps.version.outputs.value }}" --notes "Built and tested by GitHub Actions. See source changes and supervised acceptance evidence for gameplay status." --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Failed to create $tag." }
          }

      - name: Validate public release ZIP before child promotion
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/SRankSentinel.zip"
          $download = Join-Path $env:RUNNER_TEMP 'public-SRankSentinel.zip'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Invoke-WebRequest -Uri "$url`?release=${{ github.run_id }}-$attempt" -OutFile $download -TimeoutSec 60
              ./.github/scripts/Validate-Package.ps1 -PackagePath $download -ExpectedVersion '${{ steps.version.outputs.value }}'
              break
            }
            catch {
              if ($attempt -eq 12) { throw }
              Start-Sleep -Seconds 5
            }
          }

      - name: Publish authoritative child manifest and verify central catalog
        uses: MarshalTitan/Sentinel/.github/actions/distribute@4bbc5ce50837b37c8cfaee5c39a075c4f68858ed
        with:
          internal-name: SRankSentinel
          version: ${{ steps.version.outputs.value }}
          tag: ${{ steps.version.outputs.tag }}
          notification-token: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
