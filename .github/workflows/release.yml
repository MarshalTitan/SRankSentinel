name: Publish Beta

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Audit supported Faloop POI coverage
        run: node .github/scripts/Audit-FaloopCatalog.mjs FaloopCatalog.cs HuntCatalog.cs FaloopClient.cs

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Path $dalamudDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamudDir -Force

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'SRankSentinel.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Version must contain four numeric components: $version"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore
        run: dotnet restore SRankSentinel.csproj

      - name: Build release package
        run: dotnet build SRankSentinel.csproj -c Release --no-restore

      - name: Validate installable ZIP
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-Package.ps1
          -PackagePath 'bin/Release/SRankSentinel/latest.zip'
          -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Prepare named release asset
        shell: pwsh
        run: Copy-Item -LiteralPath 'bin/Release/SRankSentinel/latest.zip' -Destination "$env:RUNNER_TEMP\SRankSentinel.zip" -Force

      - name: Create or repair GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $asset = "$env:RUNNER_TEMP\SRankSentinel.zip"
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo '${{ github.repository }}'
          }
          else {
            gh release create $tag $asset `
              --repo '${{ github.repository }}' `
              --target '${{ github.sha }}' `
              --title "S Rank Sentinel ${{ steps.version.outputs.value }} beta" `
              --notes "Installable Dalamud beta package for S Rank Sentinel ${{ steps.version.outputs.value }}." `
              --prerelease
          }

      - name: Update custom-repository metadata
        shell: pwsh
        run: >-
          ./.github/scripts/Update-RepoManifest.ps1
          -ManifestPath 'repo.json'
          -Version '${{ steps.version.outputs.value }}'

      - name: Commit repository metadata
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish beta v${{ steps.version.outputs.value }} [skip ci]"
            git push origin HEAD:main
          }

      - name: Simulate a fresh public install
        shell: pwsh
        run: >-
          ./.github/scripts/Test-PublicDistribution.ps1
          -RepositoryManifestUrl 'https://raw.githubusercontent.com/MarshalTitan/SRankSentinel/main/repo.json'
          -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Detect central catalog authorization
        id: catalog-auth
        shell: pwsh
        env:
          CATALOG_TOKEN: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CATALOG_TOKEN)) {
            "enabled=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
            Write-Host "::notice::DALAMUD_CATALOG_TOKEN is not configured. The SRankSentinel release is complete; run the Sentinel 'Update Plugin Entry' workflow manually for SRankSentinel ${{ steps.version.outputs.value }}."
          }
          else {
            "enabled=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          }

      - name: Check out the central catalog
        if: steps.catalog-auth.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: MarshalTitan/Sentinel
          ref: main
          token: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
          path: central-catalog

      - name: Update only the SRankSentinel central-catalog entry
        if: steps.catalog-auth.outputs.enabled == 'true'
        shell: pwsh
        run: >-
          ./central-catalog/.github/scripts/Update-PluginEntry.ps1
          -ManifestPath 'central-catalog/repo.json'
          -InternalName 'SRankSentinel'
          -Version '${{ steps.version.outputs.value }}'

      - name: Validate the central catalog before publishing
        if: steps.catalog-auth.outputs.enabled == 'true'
        shell: pwsh
        run: >-
          ./central-catalog/.github/scripts/Test-Catalog.ps1
          -CatalogPath 'central-catalog/repo.json'
          -VerifyRemoteAssets
          -ExpectedInternalName 'SRankSentinel'
          -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Commit the central-catalog update
        if: steps.catalog-auth.outputs.enabled == 'true'
        shell: pwsh
        working-directory: central-catalog
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Update SRankSentinel to ${{ steps.version.outputs.value }}"
            git push origin HEAD:main
          }

      - name: Verify the public central catalog
        if: steps.catalog-auth.outputs.enabled == 'true'
        shell: pwsh
        run: |
          $expectedVersion = '${{ steps.version.outputs.value }}'
          $publicPath = Join-Path $env:RUNNER_TEMP 'central-repo.json'
          $published = $false
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            $cacheBuster = [Uri]::EscapeDataString("${{ github.run_id }}-$attempt-$([DateTimeOffset]::UtcNow.ToUnixTimeSeconds())")
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/MarshalTitan/Sentinel/main/repo.json?catalog=$cacheBuster" -OutFile $publicPath
            $entries = @(Get-Content -LiteralPath $publicPath -Raw | ConvertFrom-Json)
            $entry = $entries | Where-Object { $_.InternalName -eq 'SRankSentinel' } | Select-Object -First 1
            if ($null -ne $entry -and $entry.AssemblyVersion -eq $expectedVersion) {
              $published = $true
              break
            }
            Start-Sleep -Seconds 5
          }
          if (-not $published) {
            throw "The public central catalog did not publish SRankSentinel $expectedVersion before the retry limit."
          }
          ./central-catalog/.github/scripts/Test-Catalog.ps1 -CatalogPath $publicPath -VerifyRemoteAssets -ExpectedInternalName 'SRankSentinel' -ExpectedVersion $expectedVersion
