name: Publish Beta

on:
  push:
    branches:
      - main
    paths:
      - SRankSentinel.csproj
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-beta
  cancel-in-progress: false

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Audit supported Faloop POI coverage
        run: node .github/scripts/Audit-FaloopCatalog.mjs FaloopCatalog.cs HuntCatalog.cs FaloopClient.cs

      - name: Audit shared Sentinel Modern integration
        run: node .github/scripts/Audit-SentinelModern.mjs

      - name: Download and verify published SentinelCore packages
        shell: pwsh
        run: ./.github/scripts/Prepare-SentinelCore.ps1

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Path $dalamudDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamudDir -Force

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'SRankSentinel.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Version must contain four numeric components: $version"
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=v$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Restore
        run: dotnet restore SRankSentinel.csproj --locked-mode

      - name: Verify restored shared-package content hashes
        shell: pwsh
        run: ./.github/scripts/Prepare-SentinelCore.ps1 -VerifyOnly -AssetsPath obj/project.assets.json

      - name: Record dependency lock
        shell: pwsh
        run: Get-Content -LiteralPath packages.lock.json

      - name: Audit restored travel and field-recovery contracts
        run: |
          node .github/scripts/Audit-V734TravelRestore.mjs Plugin.cs NativeTravel.cs HuntCatalog.cs VNavmeshIpc.cs
          node .github/scripts/Audit-FieldRecovery.mjs Plugin.cs CombatController.cs HuntProgressPolicy.cs SRankSentinel.csproj

      - name: Run state-machine regression tests
        run: dotnet run --project SRankSentinel.StateTests/SRankSentinel.StateTests.csproj -c Release

      - name: Build release package
        run: dotnet build SRankSentinel.csproj -c Release --no-restore

      - name: Run appearance migration and native ImGui input tests
        shell: pwsh
        run: |
          ./.github/scripts/Prepare-UiTestFont.ps1
          $env:DALAMUD_ICON_FONT = Join-Path $env:RUNNER_TEMP 'Sentinel-FontAwesomeFreeSolid.otf'
          dotnet run --project SRankSentinel.UiTests/SRankSentinel.UiTests.csproj -c Release

      - name: Validate installable ZIP
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-Package.ps1
          -PackagePath 'bin/Release/SRankSentinel/latest.zip'
          -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Prepare named release asset
        shell: pwsh
        run: Copy-Item -LiteralPath 'bin/Release/SRankSentinel/latest.zip' -Destination "$env:RUNNER_TEMP\SRankSentinel.zip" -Force

      - name: Create or repair GitHub prerelease
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $asset = "$env:RUNNER_TEMP\SRankSentinel.zip"
          gh release view $tag --repo '${{ github.repository }}' *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag $asset --clobber --repo '${{ github.repository }}'
          }
          else {
            gh release create $tag $asset `
              --repo '${{ github.repository }}' `
              --target '${{ github.sha }}' `
              --title "S Rank Sentinel ${{ steps.version.outputs.value }} beta" `
              --notes "Installable Dalamud beta package for S Rank Sentinel ${{ steps.version.outputs.value }}." `
              --prerelease
          }

      - name: Update custom-repository metadata
        shell: pwsh
        run: >-
          ./.github/scripts/Update-RepoManifest.ps1
          -ManifestPath 'repo.json'
          -Version '${{ steps.version.outputs.value }}'

      - name: Commit repository metadata
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- repo.json
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "Publish beta v${{ steps.version.outputs.value }} [skip ci]"
            git push origin HEAD:main
          }

      - name: Simulate a fresh public install
        shell: pwsh
        run: >-
          ./.github/scripts/Test-PublicDistribution.ps1
          -RepositoryManifestUrl 'https://raw.githubusercontent.com/MarshalTitan/SRankSentinel/main/repo.json'
          -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Trigger central Sentinel catalog reconciliation
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:GH_TOKEN)) {
            throw 'DALAMUD_CATALOG_TOKEN is required to publish S Rank Sentinel to the central Sentinel catalog.'
          }

          $payload = @{
            event_type = 'plugin-released'
            client_payload = @{
              source_repository = '${{ github.repository }}'
              source_commit = '${{ github.sha }}'
              internal_name = 'SRankSentinel'
              version = '${{ steps.version.outputs.value }}'
              tag = '${{ steps.version.outputs.tag }}'
            }
          } | ConvertTo-Json -Depth 5

          $payload | gh api `
            --method POST `
            'repos/MarshalTitan/Sentinel/dispatches' `
            --input -
          if ($LASTEXITCODE -ne 0) {
            throw 'Failed to dispatch the central Sentinel catalog reconciliation.'
          }

      - name: Verify the public central catalog
        shell: pwsh
        run: |
          $catalogUrl = 'https://raw.githubusercontent.com/MarshalTitan/Sentinel/main/repo.json'
          $expectedVersion = '${{ steps.version.outputs.value }}'
          $expectedAsset = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/SRankSentinel.zip"

          for ($attempt = 1; $attempt -le 60; $attempt++) {
            try {
              $catalog = Invoke-RestMethod -Uri "$catalogUrl`?release=${{ github.run_id }}-$attempt"
              $entry = @($catalog | Where-Object InternalName -eq 'SRankSentinel')
              if ($entry.Count -eq 1 `
                  -and $entry[0].AssemblyVersion -eq $expectedVersion `
                  -and $entry[0].TestingAssemblyVersion -eq $expectedVersion `
                  -and $entry[0].DownloadLinkInstall -eq $expectedAsset `
                  -and $entry[0].DownloadLinkUpdate -eq $expectedAsset `
                  -and $entry[0].DownloadLinkTesting -eq $expectedAsset) {
                Write-Host "Verified S Rank Sentinel $expectedVersion in the public central catalog."
                exit 0
              }
            }
            catch {
              Write-Host "Central catalog verification attempt $attempt failed: $($_.Exception.Message)"
            }

            Start-Sleep -Seconds 5
          }

          throw "The public central Sentinel catalog did not reach S Rank Sentinel $expectedVersion within five minutes."
