name: Publish Sentinel Hunts Beta

on:
  push:
    tags:
      - 'v*-sentinelhunts'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-sentinelhunts-beta
  cancel-in-progress: false

jobs:
  publish:
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')
    runs-on: windows-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud development files
        shell: pwsh
        run: |
          $dalamudDir = "$env:AppData\XIVLauncher\addon\Hooks\dev"
          New-Item -ItemType Directory -Path $dalamudDir -Force | Out-Null
          $archive = Join-Path $env:RUNNER_TEMP 'dalamud-latest.zip'
          Invoke-WebRequest -Uri 'https://goatcorp.github.io/dalamud-distrib/latest.zip' -OutFile $archive
          Expand-Archive -LiteralPath $archive -DestinationPath $dalamudDir -Force

      - name: Read and validate version
        id: version
        shell: pwsh
        run: |
          [xml]$project = Get-Content -LiteralPath 'SentinelHunts/SentinelHunts.csproj' -Raw
          $version = [string]$project.Project.PropertyGroup.Version
          if ($version -notmatch '^\d+\.\d+\.\d+\.\d+$') {
            throw "Version must contain four numeric components: $version"
          }
          $expectedTag = "v$version-sentinelhunts"
          if ('${{ github.ref_type }}' -eq 'tag' -and '${{ github.ref_name }}' -ne $expectedTag) {
            throw "Release tag '${{ github.ref_name }}' does not match project version '$expectedTag'."
          }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8
          "tag=$expectedTag" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      - name: Run core tests
        run: dotnet run --project SentinelHunts/SentinelHunts.Core.Tests/SentinelHunts.Core.Tests.csproj -c Release

      - name: Restore plugin
        run: dotnet restore SentinelHunts/SentinelHunts.csproj

      - name: Build release package
        run: dotnet build SentinelHunts/SentinelHunts.csproj -c Release --no-restore

      - name: Validate installable ZIP
        shell: pwsh
        run: >-
          ./.github/scripts/Validate-SentinelHuntsPackage.ps1
          -PackagePath 'SentinelHunts/bin/Release/SentinelHunts/latest.zip'
          -ExpectedVersion '${{ steps.version.outputs.value }}'

      - name: Prepare named release asset
        shell: pwsh
        run: Copy-Item -LiteralPath 'SentinelHunts/bin/Release/SentinelHunts/latest.zip' -Destination "$env:RUNNER_TEMP\SentinelHunts.zip" -Force

      - name: Publish immutable GitHub release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ steps.version.outputs.tag }}'
          $asset = "$env:RUNNER_TEMP\SentinelHunts.zip"
          $releaseJson = gh release view $tag --repo '${{ github.repository }}' --json targetCommitish,isDraft,isPrerelease,assets 2>$null
          $exists = $LASTEXITCODE -eq 0
          $global:LASTEXITCODE = 0
          if ($exists) {
            $release = $releaseJson | ConvertFrom-Json
            if ($release.targetCommitish -ne '${{ github.sha }}' -or $release.isDraft -or !$release.isPrerelease) {
              throw "Release $tag belongs to another source/state. Increment the version; assets are immutable."
            }
            if (@($release.assets | Where-Object name -eq 'SentinelHunts.zip').Count -ne 1) {
              throw "Release $tag must contain exactly one SentinelHunts.zip; do not replace published assets."
            }
            Write-Host "Revalidating the existing immutable release for this exact source."
          }
          else {
            gh release create $tag $asset --repo '${{ github.repository }}' --target '${{ github.sha }}' --title "Sentinel Hunts ${{ steps.version.outputs.value }}" --notes "Built and tested by GitHub Actions. See source changes and supervised acceptance evidence for gameplay status." --prerelease
            if ($LASTEXITCODE -ne 0) { throw "Failed to create $tag." }
          }

      - name: Validate public release ZIP before child promotion
        shell: pwsh
        run: |
          $url = "https://github.com/${{ github.repository }}/releases/download/${{ steps.version.outputs.tag }}/SentinelHunts.zip"
          $download = Join-Path $env:RUNNER_TEMP 'public-SentinelHunts.zip'
          for ($attempt = 1; $attempt -le 12; $attempt++) {
            try {
              Invoke-WebRequest -Uri "$url`?release=${{ github.run_id }}-$attempt" -OutFile $download -TimeoutSec 60
              ./.github/scripts/Validate-SentinelHuntsPackage.ps1 -PackagePath $download -ExpectedVersion '${{ steps.version.outputs.value }}'
              break
            }
            catch {
              if ($attempt -eq 12) { throw }
              Start-Sleep -Seconds 5
            }
          }

      - name: Publish authoritative child manifest and verify central catalog
        uses: MarshalTitan/Sentinel/.github/actions/distribute@4bbc5ce50837b37c8cfaee5c39a075c4f68858ed
        with:
          internal-name: SentinelHunts
          version: ${{ steps.version.outputs.value }}
          tag: ${{ steps.version.outputs.tag }}
          notification-token: ${{ secrets.DALAMUD_CATALOG_TOKEN }}
